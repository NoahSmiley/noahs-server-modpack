name: Publish Modpack

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1)'
        required: true
      changelog:
        description: 'Changelog for this version'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packwiz
        run: |
          curl -L -o packwiz https://github.com/packwiz/packwiz/releases/latest/download/packwiz_linux_amd64
          chmod +x packwiz

      - name: Refresh packwiz index
        run: ./packwiz refresh

      - name: Get version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.changelog }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            # Try to get changelog from release notes or commit message
            echo "changelog=Release $VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Update pack.toml version
        run: |
          sed -i 's/^version = .*/version = "${{ steps.version.outputs.version }}"/' pack.toml
          ./packwiz refresh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.git*,.github,packwiz.exe,packwiz.zip,*.mrpack,*.zip'

      - name: Notify website of new version
        run: |
          curl -X POST "${{ secrets.WEBSITE_API_URL }}/api/modpack/new-version" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.MODPACK_API_SECRET }}" \
            -d '{
              "version": "${{ steps.version.outputs.version }}",
              "commitSha": "${{ github.sha }}",
              "changelog": ${{ toJSON(steps.version.outputs.changelog) }}
            }'
